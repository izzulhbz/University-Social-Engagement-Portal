<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Social Engagement Portal | Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="feed-page">
    <header class="top-toolbar d-flex align-items-center justify-content-between px-4 py-2">
        <div class="d-flex align-items-center">
            <a href="/templates/index.html"><img class="site-logo" src="/static/img/SiT_logo_without_text.png" width="40" height="40" /></a>
        </div>
        <div class="flex-grow-1 d-flex justify-content-center px-3">
            <form class="w-100" action="/templates/search.html" method="get" style="max-width:720px;">
                <div class="input-group">
                    <input type="search" name="q" class="search-bar form-control" placeholder="Search people..." />
                    <button type="submit" class="btn btn-light"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
        <div class="d-flex align-items-center">
            <a href="/templates/friends.html" class="nav-icon text-white text-decoration-none me-3"><i class="bi bi-people fs-5"></i></a>
            <a href="/templates/notifications.html" class="nav-icon text-white text-decoration-none me-3"><i class="bi bi-bell fs-5"></i></a>
            <span class="text-white me-2 d-none d-md-inline user-name">User</span>
            <img src="https://via.placeholder.com/40" class="rounded-circle user-avatar" width="40" height="40" />
            <button class="btn btn-link text-white ms-2" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </header>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h3 class="mb-4">Search Results</h3>
                <div id="search-results"></div>
                
                <template id="search-result-template">
                    <div class="card mb-3 search-card" style="cursor: pointer;">
                        <div class="card-body d-flex align-items-center">
                            <img class="rounded-circle me-3 search-avatar" src="" width="64" height="64" />
                            <div class="flex-grow-1 search-clickable">
                                <h5 class="mb-0 search-name">Name</h5>
                                <small class="text-muted search-role">Role</small>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- User Profile Modal -->
                <div class="modal fade" id="userProfileModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">User Profile</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="text-center mb-4">
                                    <img id="profile-modal-avatar" src="" class="rounded-circle mb-3" width="120" height="120" alt="User Avatar" />
                                    <h4 id="profile-modal-name" class="mb-1"></h4>
                                    <p id="profile-modal-email" class="text-muted mb-2"></p>
                                    <span id="profile-modal-role" class="badge bg-primary"></span>
                                </div>
                                <div id="profile-modal-details">
                                    <!-- Dynamic content based on role -->
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initSearch);
    </script>
</body>
</html>
