<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>University Social Engagement Portal | User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/style.css"/>
    <link rel="stylesheet" href="/static/css/admin-style.css"/>
</head>
<body class="admin-body">
    <!-- Sidebar -->
    <nav class="sidebar">
        <button class="btn-close-sidebar d-lg-none">
            <i class="bi bi-x-lg"></i>
        </button>
        
        <div class="text-center mb-4 px-3">
            <img src="/static/img/SiT_logo_without_text.png" width="60" class="mb-2" />
            <h6 class="fw-semibold mt-2">Admin Panel</h6>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/templates/dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/templates/users.html" class="nav-link active">
                    <i class="bi bi-people"></i>
                    <span>User Management</span>
                </a>
            </li>
        </ul>
        
        <div class="mt-auto p-3 text-center">
            <button class="btn btn-link text-white" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-container">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark fs-4 me-2 d-lg-none sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="h3 mb-0">User Management</h1>
            </div>
            <button id="createUserBtn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal">
                <i class="bi bi-person-plus"></i>
                <span class="d-none d-md-inline ms-2">Create User</span>
            </button>
        </div>

        <!-- Search -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="input-group">
                    <input type="text" id="searchUser" class="form-control" placeholder="Search users by name, email, or role..." />
                    <button class="btn btn-outline-primary" id="searchBtn">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card">
            <div class="card-body table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create User Modal -->
    <div class="modal fade" id="createUserModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" id="create-email" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" id="create-name" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" id="create-password" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role *</label>
                        <select id="create-role" class="form-select" onchange="toggleRoleFields('create')">
                            <option value="STUDENT">Student</option>
                            <option value="FACULTY">Faculty</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div class="mb-3" id="create-course-field">
                        <label class="form-label">Course *</label>
                        <input type="text" id="create-course" class="form-control" />
                    </div>
                    <div class="mb-3" id="create-position-field" style="display:none;">
                        <label class="form-label">Academic Position *</label>
                        <input type="text" id="create-position" class="form-control" />
                    </div>
                    <div class="mb-3" id="create-job-field" style="display:none;">
                        <label class="form-label">Job Title</label>
                        <input type="text" id="create-job" class="form-control" />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="createUserSubmitBtn" class="btn btn-primary" onclick="createUser()">Create User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-user-id" />
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="edit-name" class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea id="edit-bio" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3" id="edit-course-field" style="display:none;">
                        <label class="form-label">Course</label>
                        <input type="text" id="edit-course" class="form-control" />
                    </div>
                    <div class="mb-3" id="edit-position-field" style="display:none;">
                        <label class="form-label">Academic Position</label>
                        <input type="text" id="edit-position" class="form-control" />
                    </div>
                    <div class="mb-3" id="edit-job-field" style="display:none;">
                        <label class="form-label">Job Title</label>
                        <input type="text" id="edit-job" class="form-control" />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveUserEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Confirm Deletion</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete <strong id="deleteUserName"></strong>?
                    This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/admin-sidebar.js"></script>
    <script src="/static/js/admin-users.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initAdminUsers);
    </script>
</body>
</html>
