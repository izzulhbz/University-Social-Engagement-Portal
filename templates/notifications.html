<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Social Engagement Portal | Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        .notification-card {
            transition: all 0.2s ease;
        }
        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .notif-icon {
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="feed-page">
    <header class="top-toolbar d-flex align-items-center justify-content-between px-4 py-2">
        <div class="d-flex align-items-center">
            <a href="/templates/index.html"><img class="site-logo" src="/static/img/SiT_logo_without_text.png" width="40" height="40" alt="Logo" /></a>
        </div>
        <div class="flex-grow-1 d-flex justify-content-center px-3">
            <form class="w-100" action="/templates/search.html" method="get" style="max-width:720px;">
                <div class="input-group">
                    <input type="search" name="q" class="search-bar form-control" placeholder="Search people..." />
                    <button type="submit" class="btn btn-light"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
        <div class="d-flex align-items-center">
            <a href="/templates/friends.html" class="nav-icon text-white text-decoration-none me-3"><i class="bi bi-people fs-5"></i></a>
            <a href="/templates/notifications.html" class="nav-icon text-white text-decoration-none me-3 position-relative">
                <i class="bi bi-bell-fill fs-5"></i>
                <span class="notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
            </a>
            <a href="/templates/profile.html" class="text-white text-decoration-none me-3">
                <span class="me-2 d-none d-md-inline user-name">User</span>
                <img src="https://via.placeholder.com/40" class="rounded-circle user-avatar" width="40" height="40" alt="User" />
            </a>
            <button class="btn btn-link text-white" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </header>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">
                        <i class="bi bi-bell me-2"></i>Notifications
                    </h3>
                    <button class="btn btn-sm btn-outline-primary" onclick="markAllAsRead()">
                        <i class="bi bi-check-all"></i> Mark All as Read
                    </button>
                </div>
                
                <div id="notifications-list"></div>
                
                <template id="notification-card-template">
                    <div class="card mb-3 notification-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="d-flex align-items-start flex-grow-1">
                                    <div class="me-3 notif-icon fs-4">
                                        <i class="bi bi-bell-fill"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 class="mb-1 notif-title">Title</h6>
                                        <div class="small text-muted notif-body">Body</div>
                                        <div class="small text-muted mt-2 notif-time">Time</div>
                                    </div>
                                </div>
                                <button class="btn btn-sm btn-outline-danger btn-delete-notification ms-2" title="Delete notification">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Delete Modal -->
                <div class="modal fade" id="confirmDeleteNotificationModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirm Delete</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">Are you sure you want to delete this notification?</div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" id="confirm-delete-notif-btn" class="btn btn-danger">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/comments.js"></script>
    <script src="/static/js/notifications.js"></script>
    <script>
        // Mark all notifications as read
        async function markAllAsRead() {
            try {
                await apiRequest('/api/notifications/read-all', {
                    method: 'POST'
                });
                showSuccess('All notifications marked as read');
                await loadNotifications();
                await updateNotificationBadge();
            } catch (error) {
                showError('Failed to mark notifications as read');
                console.error(error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', initNotifications);
    </script>
</body>
</html>
