<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="../static/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="login-page">
    <main>
      <div class="login-card text-center">
        <img src="../static/img/sit_logo.png" alt="University Logo" class="logo img-fluid" />
        <h2>Create a new password</h2>
        <p>Enter your new password below. This page simulates the reset flow.</p>

        <form id="resetForm" class="text-start">
          <div class="mb-3">
            <label for="newPassword" class="form-label">New password</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Enter new password" required />
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-type new password" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Confirm</button>
          <div class="mt-2 text-center">
            <a href="login.html" class="btn btn-link">Back to login</a>
          </div>
        </form>

        <p class="footer-text">© 2025 University Social Engagement Portal</p>
      </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function(){
        const form = document.getElementById('resetForm');
        if (form) {
          form.addEventListener('submit', function(e){
            e.preventDefault();
            const a = document.getElementById('newPassword')?.value || '';
            const b = document.getElementById('confirmPassword')?.value || '';
            if (!a || !b) {
              alert('Please fill both fields');
              return;
            }
            if (a !== b) {
              alert('Passwords do not match');
              return;
            }
            // Redirect to login after success
            alert('Password reset successful');
            window.location.href = 'login.html';
          });
        }
      })();
    </script>
  </body>
</html>
