<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Social Engagement Portal | Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="feed-page">
  <!-- Navbar -->
  <header class="top-toolbar d-flex align-items-center justify-content-between px-4 py-2">
    <div class="d-flex align-items-center">
      <a href="/templates/index.html"><img class="site-logo" src="/static/img/SiT_logo_without_text.png" width="40"
          height="40" /></a>
    </div>
    <div class="flex-grow-1 d-flex justify-content-center px-3">
      <form class="w-100" action="/templates/search.html" method="get" style="max-width: 720px">
        <div class="input-group">
          <input type="search" name="q" class="search-bar form-control" placeholder="Search people..." />
          <button type="submit" class="btn btn-light">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
    </div>
    <div class="d-flex align-items-center">
      <a href="/templates/friends.html" class="nav-icon text-white text-decoration-none me-3"><i
          class="bi bi-people fs-5"></i></a>
      <a href="/templates/notifications.html" class="nav-icon text-white text-decoration-none me-3 position-relative">
        <i class="bi bi-bell fs-5"></i>
        <span class="notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          style="display: none">0</span>
      </a>
      <span class="text-white me-2 d-none d-md-inline user-name">User</span>
      <img src="https://via.placeholder.com/40" class="rounded-circle user-avatar" width="40" height="40" />
      <button class="btn btn-link text-white ms-2" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <div class="container mt-4 mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Profile Header -->
        <div class="card mb-4">
          <div class="card-body text-center">
            <div class="position-relative d-inline-block mb-3">
              <img id="profile-avatar" src="https://via.placeholder.com/150" class="rounded-circle" width="150"
                height="150" />
              <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle"
                onclick="document.getElementById('profileImageInput').click()">
                <i class="bi bi-camera"></i>
              </button>
              <input type="file" id="profileImageInput" accept=".png,.jpg,.jpeg" style="display: none"
                onchange="uploadProfileImage(event)" />
            </div>
            <h3 id="profile-name">User Name</h3>
            <p class="text-muted" id="profile-role">Role</p>
            <p id="profile-bio" class="text-muted">No bio yet</p>
            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#editProfileModal">
              <i class="bi bi-pencil"></i> Edit Profile
            </button>
          </div>
        </div>

        <!-- User's Posts -->
        <h5 class="mb-3">My Posts</h5>
        <div id="user-posts-container"></div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" id="edit-name" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea id="edit-bio" class="form-control" rows="3" placeholder="Tell us about yourself..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-primary" onclick="saveProfile()">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Change Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" id="current-password" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="new-password" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirm-password" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-primary" onclick="changePassword()">
            Change Password
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Post Modal -->
  <div class="modal fade" id="editPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea id="edit-post-content" class="form-control" rows="4"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            <div id="current-image-preview" style="display: none" class="mb-2">
              <img id="current-image" class="img-fluid rounded" style="max-height: 200px" />
              <button type="button" class="btn btn-sm btn-danger mt-2" onclick="removePostImage()">
                Remove Image
              </button>
            </div>
            <input type="file" id="edit-post-image" class="form-control" accept=".png,.jpg,.jpeg" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" id="save-post-btn" class="btn btn-primary" onclick="savePostEdit()">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Post Details Modal -->
  <div class="modal fade" id="postDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center mb-3">
            <img id="detail-author-avatar" class="rounded-circle me-3" width="50" height="50" />
            <div>
              <div id="detail-author-name" class="fw-bold"></div>
              <small id="detail-author-role" class="text-muted"></small>
            </div>
          </div>
          <div id="detail-content" class="mb-3"></div>
          <img id="detail-image" class="img-fluid rounded mb-3" style="display: none" />
          <hr />
          <div class="mb-3">
            <strong>Comments (<span id="detail-comments-count">0</span>)</strong>
          </div>

          <!-- Add Comment Form -->
          <div class="mb-3">
            <div class="d-flex align-items-start">
              <img src="https://via.placeholder.com/40" class="rounded-circle me-2 user-avatar" width="40"
                height="40" />
              <div class="flex-grow-1">
                <textarea id="new-comment-content" class="form-control mb-2" rows="2"
                  placeholder="Write a comment..."></textarea>
                <button id="submit-comment-btn" class="btn btn-primary btn-sm">
                  <i class="bi bi-send"></i> Comment
                </button>
              </div>
            </div>
          </div>

          <div id="detail-comments"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Comment Modal -->
  <div class="modal fade" id="editCommentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Comment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Comment</label>
            <textarea id="edit-comment-content" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" id="save-comment-btn" class="btn btn-primary">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="confirmDeletePostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this post?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" id="confirm-delete-post-btn" class="btn btn-danger">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Comment Confirmation Modal -->
  <div class="modal fade" id="confirmDeleteCommentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Comment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this comment?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" id="confirm-delete-comment-btn" class="btn btn-danger">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/comments.js"></script>
  <script src="/static/js/profile.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      await initProfile();
      setupCommentHandlers();
      await updateNotificationBadge();

      // Check if we need to open a specific post from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("post");
      if (postId) {
        // Wait a bit for the page to fully load
        setTimeout(async () => {
          if (window.viewPostFromNotification) {
            await window.viewPostFromNotification(postId);
          } else if (window.viewPost) {
            await window.viewPost(postId);
          }
          // Clean up URL
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );
        }, 500);
      }
    });
  </script>
</body>

</html>
