<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Social Engagement Portal | Friends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="feed-page">
    <!-- Navbar -->
    <header class="top-toolbar d-flex align-items-center justify-content-between px-4 py-2">
        <!-- Logo -->
        <div class="d-flex align-items-center">
            <a href="/templates/index.html" class="d-inline-block">
                <img class="site-logo" src="/static/img/SiT_logo_without_text.png" alt="Logo" width="40" height="40" />
            </a>
        </div>
        
        <!-- Search Bar -->
        <div class="flex-grow-1 d-flex justify-content-center px-3">
            <form class="w-100" role="search" action="/templates/search.html" method="get" style="max-width:720px;">
                <div class="input-group">
                    <input type="search" name="q" class="search-bar form-control" placeholder="Search people..." />
                    <button type="submit" class="btn btn-light">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Right Side Icons & User Menu -->
        <div class="d-flex align-items-center">
            <!-- Friends Icon -->
            <a href="/templates/friends.html" class="nav-icon text-white text-decoration-none me-3">
                <i class="bi bi-people-fill fs-5"></i>
            </a>
            
            <!-- Notifications Icon with Badge -->
            <a href="/templates/notifications.html" class="nav-icon text-white text-decoration-none me-3 position-relative">
                <i class="bi bi-bell fs-5"></i>
                <span class="notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
            </a>
            
            <!-- Profile Link -->
            <a href="/templates/profile.html" class="text-white text-decoration-none me-3">
                <span class="me-2 d-none d-md-inline user-name">User</span>
                <img src="https://via.placeholder.com/40" alt="User" class="rounded-circle user-avatar" width="40" height="40" />
            </a>
            
            <!-- Logout Button -->
            <button class="btn btn-link text-white" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </header>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h3 class="mb-4"><i class="bi bi-people me-2"></i>Your Friends</h3>
                
                <!-- Connection Requests -->
                <h5 class="mt-4">Connection Requests</h5>
                <div id="requests-list" class="mb-4"></div>
                
                <template id="request-item-template">
                    <div class="card mb-3 request-card" style="cursor: pointer;">
                        <div class="card-body d-flex align-items-center">
                            <img class="rounded-circle me-3 request-avatar" src="" width="64" height="64" alt="avatar" />
                            <div class="flex-grow-1 request-clickable">
                                <h5 class="mb-0 request-name">Name</h5>
                                <small class="text-muted request-role">Role</small>
                            </div>
                            <div>
                                <button class="btn btn-primary btn-sm me-2 btn-accept">Accept</button>
                                <button class="btn btn-outline-secondary btn-sm btn-decline">Decline</button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Connections List -->
                <h5 class="mt-4">Connections</h5>
                <div id="connections-list"></div>
                
                <template id="connection-item-template">
                    <div class="card mb-3 connection-card" style="cursor: pointer;">
                        <div class="card-body d-flex align-items-center">
                            <img class="rounded-circle me-3 connection-avatar" src="" width="64" height="64" alt="avatar" />
                            <div class="flex-grow-1 connection-clickable">
                                <h5 class="mb-0 connection-name">Name</h5>
                                <small class="text-muted connection-role">Role</small>
                            </div>
                            <div>
                                <button class="btn btn-outline-danger btn-sm btn-delete-connection">
                                    <i class="bi bi-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirm Remove</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">Are you sure you want to remove this connection?</div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" id="confirm-delete-btn" class="btn btn-danger">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Profile Modal -->
                <div class="modal fade" id="userProfileModal" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">User Profile</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="text-center mb-4">
                                    <img id="profile-modal-avatar" src="" class="rounded-circle mb-3" width="120" height="120" alt="User Avatar" />
                                    <h4 id="profile-modal-name" class="mb-1"></h4>
                                    <p id="profile-modal-email" class="text-muted mb-2"></p>
                                    <span id="profile-modal-role" class="badge bg-primary"></span>
                                </div>
                                <div id="profile-modal-details">
                                    <!-- Dynamic content based on role -->
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/friends.js"></script>
    <script src="/static/js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await initFriends();
            await updateNotificationBadge();
        });
    </script>
</body>
</html>
