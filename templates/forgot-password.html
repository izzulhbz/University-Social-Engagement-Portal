<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../static/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="login-page">
    <main>
      <div class="login-card text-center">
        <img src="../static/img/sit_logo.png" alt="University Logo" class="logo img-fluid" />
        <h2>Reset your password</h2>
        <p>Enter your university email and we'll send a reset link (demo only).</p>

        <form id="forgotForm" class="text-start">
          <div class="mb-3">
            <label for="resetEmail" class="form-label">University Email</label>
            <input type="email" class="form-control" id="resetEmail" name="email" placeholder="your@uni.edu" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Send reset link</button>
          <div class="mt-2 text-center">
            <a href="login.html" class="btn btn-link">Back to login</a>
          </div>
    </form>

    <p class="footer-text">© 2025 University Social Engagement Portal</p>
      </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function(){
        const form = document.getElementById('forgotForm');
        if (form) {
          form.addEventListener('submit', function(e){
            e.preventDefault();
            // Demo confirmation
            alert('If this were a real app, a reset link would be sent to ' + (document.getElementById('resetEmail')?.value || '(no email)'));
            // Optional return to login
            window.location.href = 'login.html';
          });
        }
      })();
    </script>
  </body>
</html>
