<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Social Engagement Portal | Login</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="login-page">
    <main>
      <div class="login-card text-center">
        <img src="/static/img/sit_logo.png" alt="University Logo" class="logo img-fluid" />
        <h2>University Social Engagement Portal</h2>
        <p>Building Bonds Beyond Basic Bulletins</p>

        <form id="loginForm" class="text-start">
          <div class="mb-3">
            <label for="email" class="form-label">University Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. user@sit.edu.sg" required />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Log In</button>
          <div class="mt-2 text-center">
            <button id="forgotPasswordBtn" type="button" class="btn btn-link">Forgot password?</button>
          </div>
        </form>

        <div class="mt-4">
          <small class="text-muted">
            <strong>Demo Credentials:</strong><br>
            Student: matthew2@sit.edu.sg / password<br>
            Faculty: madison@sit.edu.sg / password<br>
            Admin: admin@sit.edu.sg / password
          </small>
        </div>

        <p class="footer-text mt-4">© 2025 University Social Engagement Portal</p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
